name: Update profile cards

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "profile.json"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fetch public data and build the SVG cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py

      - name: Commit changed cards
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add assets/ data/public-github.json README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public profile cards"
          git pull --rebase origin "$PROFILE_BRANCH"
          git push
